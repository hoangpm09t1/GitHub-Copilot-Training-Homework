spring:
  application:
    name: User Management System
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

  datasource:
    url: jdbc:h2:file:./data/testdb
    driverClassName: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        "[hibernate.dialect]": org.hibernate.dialect.H2Dialect

jwt:
  secret: mySecretKeyForJWTThatIsAtLeast256BitsLongForHS256Algorithm
  expiration: 86400000

server:
  port: 0
